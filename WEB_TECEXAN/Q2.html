<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    margin: 30px;
  }

  h1 {
    background: #17365d;
    color: white;
    text-align: center;
    padding: 20px;
  }

  h2 {
    color: #17365d;
  }

  form {
    background: white;
    padding: 20px;
    max-width: 500px;
  }

  label {
    display: block;
  }

  input {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
  }

  button {
    background: #17365d;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
  }

  button:hover {
    background: #28558c;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
  }

  th, td {
    border: 1px solid gray;
    padding: 10px;
    text-align: left;
  }

  th {
    background: #17365d;
    color: white;
  }
</style>
